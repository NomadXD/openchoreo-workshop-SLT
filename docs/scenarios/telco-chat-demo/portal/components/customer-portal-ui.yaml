apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: customer-portal-ui
  namespace: default
spec:
  owner:
    projectName: portal

  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: customer-portal-ui
  namespace: default
spec:
  owner:
    componentName: customer-portal-ui
    projectName: portal
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  container:
    # Built locally — see ../../services/customer-portal-ui/README.md.
    image: telco-chat-demo/customer-portal-ui:dev
    env:
      # PLACEHOLDER — chat-gateway is in a different project, so this can't
      # be a Workload dependency (that mechanism only injects internal
      # project/namespace-visible URLs, never a gateway's public one). Deploy
      # chat-gateway first, read its external URL from the console or
      # `occ endpoint list`, then patch these two values and redeploy.
      - key: CHAT_GATEWAY_HTTP_URL
        value: "http://CHANGE-ME-chat-gateway-external-url"
      - key: CHAT_GATEWAY_WS_URL
        value: "ws://CHANGE-ME-chat-gateway-external-url"
