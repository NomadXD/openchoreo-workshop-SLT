apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: employee-console-ui
  namespace: default
spec:
  owner:
    projectName: portal

  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: employee-console-ui
  namespace: default
spec:
  owner:
    componentName: employee-console-ui
    projectName: portal
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  container:
    # Built locally — see ../../services/employee-console-ui/README.md.
    image: telco-chat-demo/employee-console-ui:dev
    env:
      # PLACEHOLDER — see the matching note in customer-portal-ui.yaml.
      - key: CHAT_GATEWAY_HTTP_URL
        value: "http://CHANGE-ME-chat-gateway-external-url"
      - key: CHAT_GATEWAY_WS_URL
        value: "ws://CHANGE-ME-chat-gateway-external-url"
      # The Customers/Incidents dashboard tabs call these two directly —
      # chat-gateway is chat-only, it does not proxy them. Both must stay
      # externally reachable (see telco-services/components/*.yaml) for
      # this to work, since there's no other path from a browser to them.
      - key: SUBSCRIPTION_SERVICE_URL
        value: "http://CHANGE-ME-subscription-service-external-url"
      - key: NETWORK_OPS_SERVICE_URL
        value: "http://CHANGE-ME-network-ops-service-external-url"
