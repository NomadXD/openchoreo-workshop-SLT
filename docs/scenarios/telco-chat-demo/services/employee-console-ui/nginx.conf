server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # config.js is rewritten by docker-entrypoint.sh on every container
    # start — never let it (or the HTML shell) be cached by the browser.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Hashed build assets are safe to cache long-term.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for any other path.
    location / {
        try_files $uri /index.html;
    }
}
