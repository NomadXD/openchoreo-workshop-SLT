# chat-cache is a plain Component, not a `Resource` — this demo doesn't rely
# on a Valkey/Redis ClusterResourceType being pre-installed on the target
# cluster (only `postgres` is confirmed available, per the doclet scenario).
# A stock redis image behind a Component/Workload works on any install and is
# exactly the pattern samples/from-image/url-shortener uses for its own Redis.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: chat-cache
  namespace: default
spec:
  owner:
    projectName: support-agent

  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: chat-cache
  namespace: default
spec:
  owner:
    componentName: chat-cache
    projectName: support-agent
  endpoints:
    tcp:
      type: TCP
      port: 6379
  container:
    image: redis:7-alpine
