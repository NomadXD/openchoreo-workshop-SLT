apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: chat-gateway
  namespace: default
spec:
  owner:
    projectName: support-agent

  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: chat-gateway
  namespace: default
spec:
  owner:
    componentName: chat-gateway
    projectName: support-agent
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  dependencies:
    endpoints:
      - project: support-agent
        component: chat-agent
        name: http
        visibility: project
        envBindings:
          address: CHAT_AGENT_URL
      # Cross-project, same as chat-agent's own dependency on these two —
      # backs the employee dashboard's /api/customers and /api/reports/*
      # routes. Same unverified-by-sample namespace-visibility caveat and
      # fallback as chat-agent's Workload.
      - project: telco-services
        component: subscription-service
        name: subscription-api
        visibility: namespace
        envBindings:
          address: SUBSCRIPTION_SERVICE_URL
      - project: telco-services
        component: network-ops-service
        name: network-ops-api
        visibility: namespace
        envBindings:
          address: NETWORK_OPS_SERVICE_URL
    resources:
      - ref: chat-db
        envBindings:
          url: DATABASE_URL
      - ref: chat-cache
        envBindings:
          url: REDIS_URL
  container:
    # Built locally — see ../../services/chat-gateway/README.md for the build
    # + image-import steps for your cluster.
    image: telco-chat-demo/chat-gateway:dev
    env:
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        # Demo-only literal. Replace with a valueFrom.secretKeyRef before
        # this ever runs anywhere that matters.
        value: "dev-secret-change-me"
